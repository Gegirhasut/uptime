name: check
# Every 5 minutes (GitHub may start it a few minutes late): are the game server and the sites up? check.sh says it to the phone.
on:
  schedule:
    - cron: "1-59/5 * * * *"   # (minutes 1, 6, 11…: off the top of the hour, when GitHub is busiest)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Look at the servers
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash check.sh
      # GitHub stops a public repo's schedule after 60 days without commits: a line to alive.txt every 20 days.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date -u +%s) - last )) -gt $(( 20 * 86400 )) ]; then date -u +%F > alive.txt; fi
      - name: Save the state
        run: |
          git config user.name "uptime-check"
          git config user.email "uptime-check@users.noreply.github.com"
          # only the files that exist: one missing name makes git add drop the whole list
          for f in state*.txt OUTAGES*.md alive.txt; do if [ -f "$f" ]; then git add -- "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "state: $(for f in state*.txt; do printf '%s=%s ' "${f%.txt}" "$(cut -d' ' -f1 "$f")"; done)"
            git push
          fi
